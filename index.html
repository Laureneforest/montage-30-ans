  bySpace.map(s=>{
    const a=arr.filter(x=>x.space===s), d=a.filter(x=>state.doneM[x.id]).length;
    return `<div class="spaceTitle"><div><h2 style="margin:0">${esc(s)}</h2><small>${d}/${a.length} éléments dispatchés</small></div></div><table><thead><tr><th>OK matériel</th><th>Matériel</th><th>Qté</th><th>Réf.</th><th class="hideMob">Catégorie</th></tr></thead><tbody>${a.map(x=>`<tr class="${state.doneM[x.id]?'done':''}"><td><input class="check" type="checkbox" ${state.doneM[x.id]?'checked':''} onchange="state.doneM['${x.id}']=this.checked;persist();cloudPatch('${x.id}',{ok_espace:this.checked});renderBody()"></td><td><b>${esc(x.name)}</b><div class="subtle">Destination : ${esc(x.space)}</div>${x.note?`<div class="warn">${esc(x.note)}</div>`:''}</td><td><b>${esc(x.qty)}</b> ${esc(x.unit)}</td><td class="${String(x.ref).includes('confirmer')?'warn':'ref'}">${esc(x.ref||'—')}</td><td class="hideMob"><span class="badge">${esc(x.category)}</span></td></tr>`).join('')}</tbody></table>`;
  }).join('');
}
function renderMaterials(q){
  let arr=state.items.filter(x=>(currentSpace==='Tous les espaces'||x.space===currentSpace)&&JSON.stringify(x).toLowerCase().includes(q));
  if(!arr.length)return '<div class=empty>Aucun matériel</div>';
  const shownSpaces=spaces.filter(s=>currentSpace==='Tous les espaces'||s===currentSpace);
  return shownSpaces.map(s=>{
    let a=arr.filter(x=>x.space===s);if(!a.length)return'';
    let d=a.filter(x=>state.doneM[x.id]).length;
    return `<div class=spaceTitle><div><h2 style="margin:0">${esc(s)}</h2><small>${d}/${a.length} éléments dispatchés · ${pct(d,a.length)}%</small></div><div style="width:220px;max-width:35vw"><div class=progress><i style="width:${pct(d,a.length)}%"></i></div></div></div><table><thead><tr><th>OK matériel</th><th>Matériel</th><th>Qté</th><th>Fournisseur / marque</th><th>Réf.</th><th class=hideMob>Catégorie</th><th></th></tr></thead><tbody>${a.map(x=>`<tr class="${state.doneM[x.id]?'done':''}"><td><input class=check type=checkbox ${state.doneM[x.id]?'checked':''} onchange="state.doneM['${x.id}']=this.checked;persist();cloudPatch('${x.id}',{ok_espace:this.checked});renderBody()"></td><td>${esc(x.name)}${supplierBase(x.vendor)==='BCE'?`<div class="subtle">BCE · vérifier aussi dans “BCE · À prendre”</div>`:''}${x.note?`<div class=warn>${esc(x.note)}</div>`:''}</td><td><b>${esc(x.qty)}</b> ${esc(x.unit)}</td><td><span class="vendor">${esc(supplierBase(x.vendor)||"—")}</span></td><td class="${String(x.ref).includes('confirmer')?'warn':'ref'}">${esc(x.ref||'—')}</td><td class=hideMob><span class=badge>${esc(x.category)}</span></td><td><button class="btn alt" onclick="del('${x.id}')">×</button></td></tr>`).join('')}</tbody></table>`
  }).join('')
}
function openModal(){
  document.getElementById('modalWrap').style.display='grid';
  document.getElementById('fSpace').innerHTML=spaces.map(s=>`<option ${currentSpace===s?'selected':''}>${esc(s)}</option>`).join('');
  document.getElementById('materialFields').style.display='block'
}
function closeModal(){document.getElementById('modalWrap').style.display='none'}
function saveNew(){
  let name=fName.value.trim();if(!name)return;
  const ni={id:'uM'+Date.now(),space:fSpace.value,category:'Ajout manuel',name,qty:fQty.value||'',unit:fUnit.value,vendor:fVendor.value,ref:fRef.value,source:'Manuel',note:''};state.items.push(ni);
  persist();sb.from('materiel').insert({id:ni.id,espace:ni.space,nom:ni.name,quantite:JSON.stringify({qty:ni.qty,unit:ni.unit,category:ni.category,note:''}),fournisseur:ni.vendor,reference:ni.ref,pris_bce:false,ok_espace:false,ordre:state.items.length});closeModal();currentSpace=fSpace.value;render();['fName','fQty','fUnit','fVendor','fRef'].forEach(id=>document.getElementById(id).value='')
}
function del(id){if(!confirm('Supprimer cet élément ?'))return;state.items=state.items.filter(x=>x.id!==id);persist();sb.from('materiel').delete().eq('id',id);renderBody()}
function exportState(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dispatch-materiel-caulier-sauvegarde.json';a.click()}
function importState(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);state.items=state.items||seed.items;state.doneM=state.doneM||{};state.doneBCE=state.doneBCE||{};persist();render()}catch{alert('Fichier invalide')}};r.readAsText(f)}
render();initCloud();</script></body></html>
